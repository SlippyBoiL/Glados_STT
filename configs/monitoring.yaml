# Monitoring profile(s) for SSH devices.
#
# You can keep it simple: define default services/containers you care about,
# and per-device overrides keyed by the device name in configs/devices.yaml.
#
# IMPORTANT: do not store passwords here.
defaults:
  interval_sec: 30
  warn_disk_percent: 90
  warn_load_per_cpu: 1.5
  services: []
  docker_containers: []
  commands: []

devices:
  proxmox:
    services: ["pveproxy", "pvedaemon", "pvestatd"]
    commands:
      - name: "pve_version"
        cmd: "pveversion -v 2>/dev/null | head -n 5 || echo 'pveversion missing'"
      - name: "pve_cluster"
        cmd: "pvecm status 2>/dev/null | head -n 20 || echo 'not a cluster / pvecm unavailable'"
      - name: "pve_vms"
        cmd: "qm list 2>/dev/null || echo 'qm list unavailable'"
      - name: "pve_web"
        cmd: "curl -sk -o /dev/null -w '%{http_code}' --connect-timeout 3 http://127.0.0.1:8080/ || echo 'web check failed'"

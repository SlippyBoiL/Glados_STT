# Monitoring profile(s) for SSH devices.
#
# You can keep it simple: define default services/containers you care about,
# and per-device overrides keyed by the device name in configs/devices.yaml.
#
# IMPORTANT: do not store passwords here.
defaults:
  interval_sec: 30
  warn_disk_percent: 90
  warn_load_per_cpu: 1.5
  services: []
  docker_containers: []
  commands: []

devices:
  pihole:
    services: ["pihole-FTL"]
    commands:
      - name: "pihole_status"
        cmd: "command -v pihole >/dev/null 2>&1 && pihole status || echo 'pihole command missing'"

  twingate:
    # common cases: dockerized connector or a systemd service
    docker_containers: ["twingate"]
    commands:
      - name: "twingate_systemd"
        cmd: "systemctl list-units --type=service --state=running 2>/dev/null | grep -i twingate || echo 'no running twingate systemd service found'"
      - name: "twingate_docker"
        cmd: "command -v docker >/dev/null 2>&1 && docker ps --format '{{.Names}}' | grep -i twingate || echo 'no running twingate docker container found'"


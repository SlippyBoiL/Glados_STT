[project]
name = "glados"
version = "0.1.0"
description = "Local GLaDOS-style assistant; CLI helpers inspired by OpenJarvis."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "openai>=1.0",
  "requests>=2.0",
]

[project.scripts]
glados = "glados_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["glados_cli", "glados_config"]
